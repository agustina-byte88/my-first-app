<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clicks | Colegio Bolívar</title>

    <style>
        /* Estilos generales - Dark Mode */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #050b1a, #101f40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Tarjeta principal */
        .contenedor {
            background: rgba(17, 30, 56, 0.95);
            padding: 45px 35px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.08);
            text-align: center;
            width: 90%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .contenedor:hover {
            transform: translateY(-5px);
        }

        /* Títulos */
        h1 {
            color: #00f5ff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        h2 {
            color: #a8b8d8;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        p {
            color: #d0dcf0;
            font-size: 15px;
            margin-bottom: 15px;
        }

        /* Contador */
        #contador {
            font-size: 85px;
            font-weight: 800;
            color: #00f5ff;
            text-shadow:
                0 0 10px rgba(0, 245, 255, 0.5),
                0 0 30px rgba(0, 245, 255, 0.2);
            margin: 20px 0 30px;
            transition: transform 0.2s ease;
        }

        /* Botón principal neón */
        .boton-click {
            background: transparent;
            color: #00f5ff;
            border: 2px solid #00f5ff;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.25);
            transition: all 0.3s ease;
            width: 100%;
        }

        .boton-click:hover {
            background: #00f5ff;
            color: #050b1a;
            box-shadow:
                0 0 20px rgba(0, 245, 255, 0.6),
                0 0 40px rgba(0, 245, 255, 0.3);
            transform: scale(1.03);
        }

        .boton-click:active {
            transform: scale(0.97);
        }

        /* Botón reiniciar */
        .reiniciar {
            background: transparent;
            color: #ff5c8a;
            border: 1px solid #ff5c8a;
            padding: 12px 25px;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 18px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .reiniciar:hover {
            background: #ff5c8a;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 92, 138, 0.4);
        }

        /* Animación del contador */
        .animacion {
            animation: pulso 0.3s ease;
        }

        @keyframes pulso {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Pie de página */
        footer {
            margin-top: 35px;
            color: #7183a6;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* Adaptación para dispositivos móviles */
        @media (max-width: 480px) {
            .contenedor {
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }

            #contador {
                font-size: 70px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>Colegio Bolívar</h1>

        <h2>Contador de Clicks para Eventos</h2>

        <p>¡Haz clic para participar!</p>

        <div id="contador" aria-live="polite">0</div>

        <button class="boton-click" onclick="incrementarContador()">
            +1 Click
        </button>

        <button class="reiniciar" onclick="reiniciarContador()">
            Reiniciar contador
        </button>

        <footer>
            Colegio Bolívar | Eventos Escolares
        </footer>

    </main>

    <script>
        // Inicializar el contador
        let clicks = 0;

        // Obtener el elemento del contador
        const contadorElemento = document.getElementById("contador");

        // Función para incrementar el contador
        function incrementarContador() {
            clicks++;

            // Actualizar el número
            contadorElemento.textContent = clicks;

            // Reiniciar la animación para cada clic
            contadorElemento.classList.remove("animacion");
            void contadorElemento.offsetWidth;
            contadorElemento.classList.add("animacion");
        }

        // Función para reiniciar el contador
        function reiniciarContador() {
            clicks = 0;

            // Actualizar el número
            contadorElemento.textContent = clicks;

            // Quitar animación
            contadorElemento.classList.remove("animacion");
        }
    </script>

</body>
</html>
